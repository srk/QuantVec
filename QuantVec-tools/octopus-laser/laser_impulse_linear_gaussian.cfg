[Timespan]
# Specify the complete span of time for generating field values
# The user is responsible for units! (Octopus by default uses atomic units)
# Time start
time_start = 0.0
# Time end (a little over 2 fs)
time_end = 100.0
# Time step
time_step = 0.1

# You can have multiple field block definitions after here with different names
# Field expressions can use time 't' , Python math module functions, Numpy functions [as np.name() ] and named parameters
# Separate the field definitions by a blank line, comment characters (#) are allowed
# e.g.

[Field_1]
# A descriptive name for this field
name = Linear polarization, 2 fs gaussian pulse, peak at 1 fs, CEP=0, tau = sigma = 12.0au   
# Start time of the field
t_start = 0.0
# Time when this field ends (= 2 fs)
t_end =  82.6828
# List of named parameters (variable=value), comma-separated, quote-delimited. Can be an empty string.
params = "tpeak=41.3414,w=0.2738,peakamp=0.01,cep=0, tau=12.0"
# Expression for amplitude vs. time t . Can use Python math module functions and named parameters
amp = peakamp*(sin((w*t)+cep))*exp((-1.0*(t-tpeak)**2)/(2.0*tau*tau))
# Expressions for the x-,y- and z- components of the field
fx = 1.0
fy = 0.0
fz = 0.0
# Specification of the user-chosen x-, y-, z- axes for the field in simulation (lab) coordinates
# chose the direction (1,1,1) - will be normalized first
xdir = [1.0,1.0,1.0]
ydir = [0.0,1.0,0.0]
zdir = [0.0,0.0,1.0]
# End of this field block

# more field definition blocks here if needed
